[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-launcher"
version = "0.1.0"
description = "Launch Ersilia models over large chemical libraries, on a SLURM cluster or a plain remote machine"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name="Marina Miñarro Lleonar", email="marina@ersilia.io"},
  {name="Ersilia Open Source Initiative", email="hello@ersilia.io"}
]
requires-python = ">=3.10"

dependencies = [
  "click==8.2.1",
  "rich==14.2.0",
  "rich-click==1.9.9",
  "textual==8.2.8",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.15.11",
]

[project.scripts]
model-launcher = "model_launcher.cli.create_cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_launcher = ["tui/*.tcss", "remote/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
